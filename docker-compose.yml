services:
  nginx:
    image: nginx:alpine
    pull_policy: if_not_present
    container_name: shore-nginx
    restart: unless-stopped
    ports:
      - "3202:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
    networks:
      - shore-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shore-frontend
    restart: unless-stopped
    networks:
      - shore-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shore-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-shore_app}:${POSTGRES_PASSWORD:-shore_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-shore_db}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_BUCKET=${MINIO_BUCKET:-shore-procedures}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-shore_admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-shore_secure_minio_pass_2026}
      - JWT_SECRET=${JWT_SECRET:-shore_jwt_secret_key_super_secure_2026}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - shore-network

  postgres:
    image: postgres:17-alpine
    pull_policy: if_not_present
    container_name: shore-postgres
    restart: unless-stopped
    ports:
      - "3200:5432"
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shore_db}
      POSTGRES_USER: ${POSTGRES_USER:-shore_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shore_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./shore_db_backup.sql:/docker-entrypoint-initdb.d/01_backup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shore_app} -d ${POSTGRES_DB:-shore_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shore-network

  minio:
    image: elestio/minio:latest
    pull_policy: if_not_present
    container_name: shore-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "3201:9000"
      - "3203:9001"
    env_file:
      - path: .env
        required: false
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-shore_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-shore_secure_minio_pass_2026}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shore-network

  minio-init:
    image: elestio/minio:latest
    pull_policy: if_not_present
    container_name: shore-minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-shore_admin} $${MINIO_ROOT_PASSWORD:-shore_secure_minio_pass_2026};
      mc mb --ignore-existing local/$${MINIO_BUCKET:-shore-procedures};
      mc anonymous set none local/$${MINIO_BUCKET:-shore-procedures};
      echo 'MinIO private bucket setup completed.';
      exit 0;
      "
    networks:
      - shore-network

volumes:
  postgres_data:
  minio_data:

networks:
  shore-network:
    driver: bridge
